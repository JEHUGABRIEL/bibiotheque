<div class="page-header">
  <div class="page-header-icon" style="background: linear-gradient(135deg, #6f42c1, #a855f7);">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
      <path d="M7 14s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1zm4-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6m-5.784 6A2.24 2.24 0 0 1 5 13c0-1.355.68-2.75 1.936-3.72A6.3 6.3 0 0 0 5 9c-4 0-5 3-5 4s1 1 1 1zM4.5 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5"/>
    </svg>
  </div>
  <div>
    <h2>Liste des adhérents</h2>
    <p>{{ users.length }} adhérent{{ users.length > 1 ? 's' : '' }} inscrit{{ users.length > 1 ? 's' : '' }}</p>
  </div>
</div>

<div class="table-responsive">
  <table class="data-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Identifiant</th>
        <th>Rôle</th>
        <th>Historique</th>
        <th>Modifier</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td class="text-muted-custom">{{ user.userId }}</td>
        <td><strong>{{ user.name }}</strong></td>
        <td>{{ user.username }}</td>
        <td>
          <span [class]="user.role[0].roleName === 'Admin' ? 'status-badge status-honoree' : 'status-badge status-disponible'">
            {{ user.role[0].roleName }}
          </span>
        </td>
        <td>
          <button *ngIf="user.role[0].roleName === 'User'"
                  (click)="userDetails(user.userId)" class="btn-action btn-action-primary">Voir</button>
        </td>
        <td>
          <button (click)="updateUser(user.userId)" class="btn-action btn-action-outline">Modifier</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
