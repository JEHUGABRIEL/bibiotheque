<div class="page-header">
  <div class="page-header-icon" style="background: linear-gradient(135deg, #28a745, #20c997);">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
      <path d="M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.063 3.112.752v9.746c-.935-.53-2.12-.603-3.213-.493-1.18.12-2.37.461-3.287.811zm7.5-.141c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492z"/>
    </svg>
  </div>
  <div>
    <h2>Catalogue des livres</h2>
    <p>{{ books.length }} livre{{ books.length > 1 ? 's' : '' }} dans la collection</p>
  </div>
</div>

<div class="table-responsive">
  <table class="data-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Titre</th>
        <th>Auteur</th>
        <th>Genre</th>
        <th>Exemplaires</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let book of books">
        <td class="text-muted-custom">{{ book.bookId }}</td>
        <td><strong>{{ book.bookName }}</strong></td>
        <td>{{ book.bookAuthor }}</td>
        <td>
          <span class="status-badge status-disponible">{{ book.bookGenre }}</span>
        </td>
        <td>
          <span [class]="book.noOfCopies > 0 ? 'status-badge status-disponible' : 'status-badge status-expiree'">
            {{ book.noOfCopies }}
          </span>
        </td>
        <td>
          <div class="d-flex gap-2">
            <button (click)="bookDetails(book.bookId)" class="btn-action btn-action-primary">Voir</button>
            <button (click)="updateBook(book.bookId)" class="btn-action btn-action-outline">Modifier</button>
            <button (click)="deleteBook(book.bookId)" class="btn-action btn-action-danger">Supprimer</button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
