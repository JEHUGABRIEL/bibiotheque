<div class="page-header">
  <div class="page-header-icon" style="background: linear-gradient(135deg, #20c997, #28a745);">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
      <path d="M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.063 3.112.752v9.746c-.935-.53-2.12-.603-3.213-.493-1.18.12-2.37.461-3.287.811zm7.5-.141c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492z"/>
    </svg>
  </div>
  <div>
    <h2>Historique — {{ book.bookName }}</h2>
    <p>Emprunts de ce livre</p>
  </div>
</div>

<div class="table-responsive">
  <table class="data-table">
    <thead>
      <tr>
        <th>ID Adhérent</th>
        <th>Date d'emprunt</th>
        <th>Date de retour</th>
        <th>Statut</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let borrower of borrow">
        <td class="text-muted-custom">{{ borrower.userId }}</td>
        <td>{{ borrower.issueDate }}</td>
        <td>{{ borrower.returnDate || '—' }}</td>
        <td>
          <span [class]="borrower.returnDate !== null ? 'status-badge status-honoree' : 'status-badge status-en-attente'">
            {{ borrower.returnDate !== null ? 'Retourné' : 'En cours' }}
          </span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
