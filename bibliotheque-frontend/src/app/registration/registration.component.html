<div class="register-wrapper">
  <div class="form-card">
    <div class="form-header">
      <div class="form-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 16 16">
          <path d="M6 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H2s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
          <path fill-rule="evenodd" d="M13.5 5a.5.5 0 0 1 .5.5V7h1.5a.5.5 0 0 1 0 1H14v1.5a.5.5 0 0 1-1 0V8h-1.5a.5.5 0 0 1 0-1H13V5.5a.5.5 0 0 1 .5-.5"/>
        </svg>
      </div>
      <h2>Inscrire un adhérent</h2>
      <p class="form-subtitle">Ajoutez un nouveau membre à la bibliothèque</p>
    </div>

    <div *ngIf="errorMessage" class="error-banner">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
        <path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0M7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0z"/>
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <div *ngIf="successMessage" class="success-banner">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
        <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
      </svg>
      <span>{{ successMessage }}</span>
    </div>

    <form (ngSubmit)="onSubmit()" autocomplete="off">
      <div class="form-group">
        <label for="name" class="form-label">Nom complet</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
            <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4"/>
          </svg>
          <input type="text" class="form-control" id="name" name="name"
                 [(ngModel)]="user.name" placeholder="Ex : Jean Dupont" required>
        </div>
      </div>

      <div class="form-group">
        <label for="username" class="form-label">Identifiant</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
            <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
          </svg>
          <input type="text" class="form-control" id="username" name="username"
                 [(ngModel)]="user.username" placeholder="Ex : jdupont" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Mot de passe</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
            <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2m3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2M5 9h6a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V10a1 1 0 0 1 1-1"/>
          </svg>
          <input [type]="showPassword ? 'text' : 'password'" class="form-control" id="password" name="password"
                 [(ngModel)]="user.password" placeholder="Minimum 6 caractères" required>
          <button type="button" class="password-toggle" (click)="showPassword = !showPassword">
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
              <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/>
              <path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8m8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"/>
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
              <path d="M10.79 12.912l-1.604 1.604a.5.5 0 0 1-.707 0l-1.604-1.604a5.5 5.5 0 0 1-2.225-3.388l1.418.002a.5.5 0 0 1 .5.5c0 .23-.078.453-.22.634a4.49 4.49 0 0 0-.483.953 5.5 5.5 0 0 1 2.627-2.795zm-5.734-1.07l.88-.88a4.5 4.5 0 0 1 6.364 6.364l.88-.88a5.5 5.5 0 0 0-8.128-6.483zM1.636 7.305l.88.88a5.5 5.5 0 0 0 8.128 6.483l-.88.88A6.5 6.5 0 0 1 1.636 7.305zm10.658-3.583l1.418-.002a.5.5 0 0 1 .5.5c0 .23-.078.453-.22.634a4.49 4.49 0 0 0-.483.953 5.5 5.5 0 0 1-2.225 3.388l-1.604 1.604a.5.5 0 0 1-.707 0L1.854 4.793a.5.5 0 0 1 0-.707l10-10a.5.5 0 0 1 .707 0z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="role" class="form-label">Rôle</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
            <path d="M2 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1z"/>
            <path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858"/>
          </svg>
          <select class="form-control" id="role" name="role"
                  [(ngModel)]="selectedRole" required>
            <option value="" disabled>-- Sélectionner un rôle --</option>
            <option value="Admin">Administrateur</option>
            <option value="User">Adhérent</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="!isFormValid || loading">
        <span *ngIf="loading" class="spinner"></span>
        {{ loading ? 'Inscription…' : 'Inscrire l\'adhérent' }}
      </button>
    </form>
  </div>
</div>
