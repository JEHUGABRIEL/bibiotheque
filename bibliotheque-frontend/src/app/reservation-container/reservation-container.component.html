  </div>
  <div>
    <h2>Gestion des réservations</h2>
    <p>Créer, consulter et annuler des réservations</p>
  </div>
</div>

<!-- Formulaire de création -->
<app-reservation-form
  [books]="books"
  [users]="users"
  [submitting]="formSubmitting"
  [errorMessage]="formError"
  [successMessage]="formSuccess"
  (submitRequest)="onSubmitReservation($event)">
</app-reservation-form>

<!-- Liste des réservations -->
<app-reservation-list
  [reservations]="reservations"
  [loading]="loading"
  [error]="error"
  [bookNames]="bookNames"
  [userNames]="userNames"
  (filterChange)="onFilterChange($event)"
  (cancelRequest)="onCancelReservation($event)"
  (retryRequest)="onRetry()">
</app-reservation-list>
