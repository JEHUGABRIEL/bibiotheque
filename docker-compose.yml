services:
  backend:
    build: ./bibliotheque-backend
    env_file:
      - ./docker/backend.env
      - ./docker/backend.env.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: on-failure

  frontend:
    build: ./bibliotheque-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend
