<div class="page-header">
  <div class="page-header-icon" style="background: linear-gradient(135deg, #4f6df5, #7c4dff);">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
      <path d="M2 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"/>
      <path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858"/>
    </svg>
  </div>
  <div>
    <h2>Gestion des réservations</h2>
    <p>Créer, consulter et annuler des réservations</p>
  </div>
  <button class="btn-action btn-action-primary" style="margin-left: auto;" (click)="openCreateModal()">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
      <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
    </svg>
    Nouvelle réservation
  </button>
</div>

<!-- Liste des réservations -->
<app-reservation-list
  [reservations]="reservations"
  [loading]="loading"
  [error]="error"
  [bookNames]="bookNames"
  [userNames]="userNames"
  (filterChange)="onFilterChange($event)"
  (cancelRequest)="openCancelConfirm($event)"
  (retryRequest)="onRetry()">
</app-reservation-list>

<!-- Modal: Nouvelle réservation -->
<app-modal [open]="showCreateModal" title="Nouvelle réservation" iconColor="linear-gradient(135deg, #4f6df5, #7c4dff)" (close)="showCreateModal = false">
  <form (ngSubmit)="onSubmitReservation()" class="modal-form">
    <div class="form-group">
      <label>Livre</label>
      <select [(ngModel)]="selectedBookId" name="bookId" required>
        <option [ngValue]="null" disabled>— Sélectionner un livre —</option>
        <option *ngFor="let book of books" [ngValue]="book.bookId">
          {{ book.bookName }} — {{ book.bookAuthor }}
        </option>
      </select>
    </div>
    <div class="form-group">
      <label>Adhérent</label>
      <select [(ngModel)]="selectedUserId" name="userId" required>
        <option [ngValue]="null" disabled>— Sélectionner un adhérent —</option>
        <option *ngFor="let user of users" [ngValue]="user.userId">
          {{ user.name }} ({{ user.username }})
        </option>
      </select>
    </div>

    <div *ngIf="formError" class="form-message form-error">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
        <path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0M7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0z"/>
      </svg>
      {{ formError }}
    </div>
    <div *ngIf="formSuccess" class="form-message form-success">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
        <path d="M12.736 3.97a.733.733 0 0 1 1.047 0c.286.289.29.756.01 1.05L7.88 12.01a.733.733 0 0 1-1.065.02L3.217 8.384a.757.757 0 0 1 0-1.06.733.733 0 0 1 1.047 0l3.052 3.093 5.4-6.425z"/>
      </svg>
      {{ formSuccess }}
    </div>

    <div class="form-actions">
      <button type="button" class="btn-action btn-action-outline" (click)="showCreateModal = false">Annuler</button>
      <button type="submit" class="btn-action btn-action-primary" [disabled]="!isFormValid || formSubmitting">
        <span *ngIf="formSubmitting" class="spinner-sm"></span>
        {{ formSubmitting ? 'Création…' : 'Créer la réservation' }}
      </button>
    </div>
  </form>
</app-modal>

<!-- Modal confirmation annulation -->
<app-confirm-modal
  [open]="showCancelConfirm"
  title="Annuler la réservation"
  message="Voulez-vous vraiment annuler cette réservation ?"
  confirmLabel="Annuler la réservation"
  cancelLabel="Rester"
  [danger]="true"
  iconBg="linear-gradient(135deg, #dc3545, #ff6b7a)"
  (confirm)="confirmCancel()"
  (cancel)="cancelModalClose()">
</app-confirm-modal>

<div *ngIf="cancelError" class="alert-banner alert-error" style="margin-top: 1rem;">
  {{ cancelError }}
</div>
