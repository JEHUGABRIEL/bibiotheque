<div class="create-book-wrapper">
  <div class="form-card">
    <div class="form-header">
      <div class="form-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 16 16">
          <path d="M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.063 3.112.752v9.746c-.935-.53-2.12-.603-3.213-.493-1.18.12-2.37.461-3.287.811zm7.5-.141c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.352c.881-.45 2.303-.783 3.693-.783s2.813.333 3.693.783a.5.5 0 0 0 .707-.352v-11a.5.5 0 0 0-.276-.447A10 10 0 0 0 8 1.783"/>
        </svg>
      </div>
      <h2>Ajouter un livre</h2>
      <p class="form-subtitle">Enrichissez le catalogue de la bibliothèque</p>
    </div>

    <!-- Message d'erreur -->
    <div *ngIf="errorMessage" class="error-banner">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
        <path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0M7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0z"/>
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <!-- Message de succès -->
    <div *ngIf="successMessage" class="success-banner">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
        <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
      </svg>
      <span>{{ successMessage }}</span>
    </div>

    <form (ngSubmit)="onSubmit()" autocomplete="off">
      <div class="form-group">
        <label for="bookName" class="form-label">Titre du livre</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
            <path d="M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.063 3.112.752v9.746c-.935-.53-2.12-.603-3.213-.493-1.18.12-2.37.461-3.287.811zm7.5-.141c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.352c.881-.45 2.303-.783 3.693-.783s2.813.333 3.693.783a.5.5 0 0 0 .707-.352v-11a.5.5 0 0 0-.276-.447A10 10 0 0 0 8 1.783"/>
          </svg>
          <input type="text" class="form-control" id="bookName" name="bookName"
                 [(ngModel)]="book.bookName" placeholder="Ex : Le Petit Prince" required>
        </div>
      </div>

      <div class="form-group">
        <label for="bookAuthor" class="form-label">Auteur</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
            <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
          </svg>
          <input type="text" class="form-control" id="bookAuthor" name="bookAuthor"
                 [(ngModel)]="book.bookAuthor" placeholder="Ex : Saint-Exupéry" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label for="bookGenre" class="form-label">Genre</label>
          <div class="input-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
              <path d="M7 2.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0m4.243 1.757a2.5 2.5 0 1 0-3.536 0 1 1 0 0 0-.707.707l4.5 4.5a1 1 0 0 0 .293.707V14a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-1.293a1 1 0 0 0 .293-.707zM8 2.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3"/>
            </svg>
            <input type="text" class="form-control" id="bookGenre" name="bookGenre"
                   [(ngModel)]="book.bookGenre" placeholder="Ex : Roman" required>
          </div>
        </div>

        <div class="form-group flex-1">
          <label for="noOfCopies" class="form-label">Exemplaires</label>
          <div class="input-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
              <path d="M2 2v4.586l7 7L13.586 9l-7-7zM1 2a2 2 0 0 1 2-2h4.586a1 1 0 0 1 .707.293l7 7a1 1 0 0 1 0 1.414l-4.586 4.586a1 1 0 0 1-1.414 0l-7-7A1 1 0 0 1 2 6.586z"/>
              <path d="M13 13s1 0 1-1-1-4-6-4-6 3-6 4 1 1 1 1z"/>
            </svg>
            <input type="number" class="form-control" id="noOfCopies" name="noOfCopies"
                   [(ngModel)]="book.noOfCopies" placeholder="0" min="0" required>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="!isFormValid || loading">
        <span *ngIf="loading" class="spinner"></span>
        {{ loading ? 'Ajout en cours…' : 'Ajouter le livre' }}
      </button>
    </form>
  </div>
</div>
