<div style="display: flex; justify-content: center; min-height: calc(100vh - 60px); padding: 2rem;">
  <div class="form-card">
    <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem;">
      <div style="width: 60px; height: 60px; min-width: 60px; background: linear-gradient(135deg, #6f42c1, #a855f7); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff;">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16">
          <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168z"/>
          <path d="M11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293z"/>
        </svg>
      </div>
      <div>
        <h3 style="font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 1.3rem; color: #e8e9ed; margin: 0;">Modifier l'adhérent</h3>
      </div>
    </div>

    <form (ngSubmit)="onSubmit()" autocomplete="off">
      <div class="form-group">
        <label class="form-label">Nom complet</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
            <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0"/>
          </svg>
          <input type="text" class="form-control" id="name" [(ngModel)]="user.name" name="name">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Identifiant</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
            <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
          </svg>
          <input type="text" class="form-control" id="username" [(ngModel)]="user.username" name="username">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Rôle</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
            <path d="M2 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"/>
          </svg>
          <select class="form-control" id="role" [(ngModel)]="selectedRole" name="role">
            <option value="" disabled>-- Sélectionner un rôle --</option>
            <option value="Admin">Administrateur</option>
            <option value="User">Adhérent</option>
          </select>
        </div>
      </div>

      <button type="submit" style="width: 100%; padding: 0.8rem; margin-top: 0.5rem; background: linear-gradient(135deg, #6f42c1, #a855f7); border: none; border-radius: 10px; color: #fff; font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 1rem; cursor: pointer;">
        Enregistrer les modifications
      </button>
    </form>
  </div>
</div>
