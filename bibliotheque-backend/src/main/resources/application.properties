server.port=${SERVER_PORT:8080}
spring.devtools.restart.enabled=false

# --- PostgreSQL ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bibliotheque}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
# Mot de passe : le définir via la variable d'environnement SPRING_DATASOURCE_PASSWORD
# (ou docker/backend.env.local) — jamais en clair dans ce fichier.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
hibernate.format_sql=true
