<!-- Loading Page -->
<div class="loading-page" *ngIf="loading">
  <div class="loading-content">
    <div class="loading-logo">
      <div class="loading-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 16 16">
          <path d="M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.063 3.112.752v9.746c-.935-.53-2.12-.603-3.213-.493-1.18.12-2.37.461-3.287.811zm7.5-.141c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492z"/>
        </svg>
      </div>
      <h1 class="loading-title">Bibliothèque</h1>
    </div>
    <div class="loading-spinner">
      <div class="spinner-ring"></div>
    </div>
    <p class="loading-text">Chargement en cours…</p>
  </div>
</div>

<!-- App Layout -->
<div class="app-layout" [class.has-sidebar]="isLoggedIn">

  <!-- Mobile top bar (visible only when logged in) -->
  <header class="mobile-header" *ngIf="isLoggedIn">
    <button class="hamburger" (click)="toggleSidebar()">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
      </svg>
    </button>
    <span class="mobile-brand">Bibliothèque</span>
    <div class="mobile-actions">
      <button class="navbar-btn" (click)="themeService.toggleTheme()">
        <svg *ngIf="themeService.theme === 'dark'" xmlns="http://www.w3.org/2000/svg" width="17" height="17" fill="currentColor" viewBox="0 0 16 16">
          <path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"/>
        </svg>
        <svg *ngIf="themeService.theme === 'light'" xmlns="http://www.w3.org/2000/svg" width="17" height="17" fill="currentColor" viewBox="0 0 16 16">
          <path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.414a.5.5 0 1 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"/>
        </svg>
      </button>
      <button class="navbar-btn" (click)="translationService.toggleLang()">
        <span style="font-size: 0.9rem;">{{ translationService.lang === 'fr' ? '🇫🇷' : '🇬🇧' }}</span>
      </button>
    </div>
  </header>

  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" *ngIf="isLoggedIn && sidebarOpen" (click)="closeSidebar()"></div>

  <!-- Sidebar -->
  <app-sidebar *ngIf="isLoggedIn"
               [sidebarOpen]="sidebarOpen"></app-sidebar>

  <!-- Top navbar (when logged in) -->
  <nav class="top-navbar" *ngIf="isLoggedIn">
    <div class="navbar-spacer"></div>
    <div class="navbar-actions">
      <button class="navbar-btn" (click)="themeService.toggleTheme()" [title]="themeService.theme === 'dark' ? 'Mode clair' : 'Mode sombre'">
        <svg *ngIf="themeService.theme === 'dark'" xmlns="http://www.w3.org/2000/svg" width="17" height="17" fill="currentColor" viewBox="0 0 16 16">
          <path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"/>
        </svg>
        <svg *ngIf="themeService.theme === 'light'" xmlns="http://www.w3.org/2000/svg" width="17" height="17" fill="currentColor" viewBox="0 0 16 16">
          <path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.414a.5.5 0 1 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"/>
        </svg>
      </button>
      <button class="navbar-btn" (click)="translationService.toggleLang()">
        <span style="font-size: 0.9rem;">{{ translationService.lang === 'fr' ? '🇫🇷' : '🇬🇧' }}</span>
      </button>
    </div>
  </nav>

  <!-- Main content -->
  <main class="app-main" [class.main-full]="!isLoggedIn">
    <router-outlet></router-outlet>
  </main>
</div>
